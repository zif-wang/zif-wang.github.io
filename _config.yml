description: |
  I am a Ph.D. candidate at [Georgia Institute of Technology](https://www.gatech.edu/) in Material Science and Engineering (advisor: [Dr. Ting Zhu](https://zhuresearch.prism.gatech.edu/)), with an M.S. in Computational Science and Engineering. I have extensive industrial experience at [Tesla](https://www.tesla.com/), building end-to-end Vision-Language-Action (VLA) pipelines on real robotic platforms, including data collection, model training, deployment, and Sim2Real transfer.

  My research spans **Embodied AI & Robotics**, **Generative AI for Materials**, and **AI for Science**. I am seeking positions in Robotics Learning, VLA/VLM Foundation Models, and Reinforcement Learning.

