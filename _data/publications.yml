- id: tesla-robotics-vla
  title: "Autonomous Robotics Materials Lab Demo"
  venue: "Tesla, Inc. — Material Engineering Team, 2026"
  category: industry
  description: >-
    Collected real-world data and trained Vision-Language-Action (VLA) models
    (smolVLA, π0, π0.5, π0-FAST) on a SO-101 robotic arm to enable automated
    metal sample polishing, inspection, and machine operation (on/off),
    demonstrating an end-to-end pipeline toward a fully autonomous materials lab.
  authors:
    - zifeng
  awards:
    - "End-to-End VLA Pipeline"

- id: tesla-alloys-gen
  title: "Generative AI for Alloys Material Design"
  venue: "Tesla, Inc. — Material Engineering Team, 2026"
  category: industry
  description: >-
    Developed a Transformer-based generative framework for inverse design of
    electrical steel alloys. Characterized material performance through
    mechanical, microstructural, and magnetic testing.
  authors:
    - zifeng

- id: tesla-welding
  title: "AI-Driven Laser Welding Quality Monitoring System"
  venue: "Tesla, Inc. — Manufacture Engineering Team, 2025"
  category: industry
  description: >-
    Developed machine learning models using in-process laser signals to enable
    real-time prediction of weld quality and defect detection in manufacturing.
  authors:
    - zifeng

- id: tesla-manufacturing
  title: "Manufacturing Process Optimization & Robot Teach-in"
  venue: "Tesla, Inc. — Manufacture Engineering Team, 2025"
  category: industry
  description: >-
    Optimized joining processes and robotic operations in a low-volume production
    line for a new vehicle model, including welding, mechanical fastening, and
    robot teach-in. Conducted FEA of fastener installation to guide design.
  authors:
    - zifeng

- id: gt-material-foundation
  title: "Material Foundation Model Post-training for Phase Transformations"
  venue: "Georgia Institute of Technology"
  category: research
  description: >-
    Developed a fine-tuning framework for the CHGNet foundation model by
    integrating SSNEB-derived transition trajectories to accurately predict
    phase-transition kinetics in Ti-alloys, providing high-fidelity guidance
    for metastable phase identification and energy barrier calculation.
  authors:
    - zifeng
    - ting_zhu

- id: gt-drug-release
  title: "GNN–Transformer Based Drug Release Model"
  venue: "Georgia Institute of Technology"
  category: research
  description: >-
    Developed a Graph Neural Network (GNN)–Transformer hybrid framework to
    model drug molecules and accurately predict drug-release kinetics,
    providing guidance for drug molecular design.
  authors:
    - zifeng
    - ting_zhu

- id: gt-battery
  title: "Machine Learning Interatomic Potentials for Battery Materials"
  venue: "Georgia Institute of Technology"
  category: research
  description: >-
    Applied universal machine-learning potentials (MLIP) to accurately predict
    structural and electrochemical properties of FeCl₃ as an efficient battery
    cathode material.
  authors:
    - zifeng
    - ting_zhu

- id: gt-metals
  title: "Computational Modeling on Mechanical Behavior of Metals"
  venue: "Georgia Institute of Technology"
  category: research
  description: >-
    Combined Molecular Dynamics simulations and Finite Element Analysis with
    TEM experiments to study the mechanical behavior of metal materials.
  authors:
    - zifeng
    - ting_zhu
